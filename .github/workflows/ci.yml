name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core x86_64-linux
    runs-on: ubuntu-slim
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Configure read-only Cachix
        if: >-
          vars.CACHIX_CACHE_NAME != '' &&
          !((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          skipPush: true
      - name: Configure publishing Cachix
        if: >-
          vars.CACHIX_CACHE_NAME != '' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build core artifacts
        run: >-
          nix build --print-build-logs
          .#runit .#runix .#runix-install .#vm

  desktop:
    name: Desktop ${{ matrix.package }}
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-slim
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: [bspwm, hyprland, labwc, niri, qtile, sxhkd]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Configure publishing Cachix
        if: vars.CACHIX_CACHE_NAME != ''
        uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build desktop package
        env:
          PACKAGE: ${{ matrix.package }}
        run: nix build --print-build-logs ".#${PACKAGE}"
