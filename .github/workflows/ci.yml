name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core ${{ matrix.platform.system }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 220
    strategy:
      fail-fast: false
      matrix:
        # Native runners for each architecture (ARM ones are free for public
        # repositories).
        platform:
          - { system: x86_64-linux, runner: ubuntu-latest }
          - { system: aarch64-linux, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Configure read-only Cachix
        if: >-
          !((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: runix-community
          skipPush: true
      - name: Configure publishing Cachix
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: runix-community
          authToken: ${{ secrets.runix }}
      - name: Build core artifacts
        env:
          SYSTEM: ${{ matrix.platform.system }}
        run: >-
          nix build --print-build-logs
          .#packages.${SYSTEM}.runit .#packages.${SYSTEM}.runix .#packages.${SYSTEM}.runix-install
          .#packages.${SYSTEM}.runix-installer .#packages.${SYSTEM}.runixisogen .#packages.${SYSTEM}.vm

  desktop:
    name: Desktop ${{ matrix.group }} ${{ matrix.platform.system }}
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform:
          - { system: x86_64-linux, runner: ubuntu-latest }
          - { system: aarch64-linux, runner: ubuntu-24.04-arm }
        group: [wayland, profiles, x11, fetch]
        include:
          - group: wayland
            packages: "hyprland labwc niri zwwm shojiwm driftwm vw vw-static"
          - group: profiles
            packages: >-
              profile-console profile-hyprland profile-labwc profile-niri
              profile-zwwm profile-blxshell-zwwm profile-blxshell-hyprland
          - group: x11
            packages: "bspwm qtile sxhkd"
          - group: fetch
            packages: "pfetch fastfetch"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Configure publishing Cachix
        uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: runix-community
          authToken: ${{ secrets.runix }}
      - name: Build desktop package
        env:
          PACKAGES: ${{ matrix.packages }}
          SYSTEM: ${{ matrix.platform.system }}
        run: |
          targets=()
          for package in ${PACKAGES}; do targets+=(".#packages.${SYSTEM}.${package}"); done
          nix build --keep-going --print-build-logs "${targets[@]}"
